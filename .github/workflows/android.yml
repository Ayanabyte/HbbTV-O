name: O! LOVEStv Lab APK
on:
  push:
    branches: [main, o-lovestv-lab]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK / NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk O-LOVEStv-Lab-0.1.0-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: O-LOVEStv-Lab-APK
          path: O-LOVEStv-Lab-0.1.0-test.apk
      - name: Publish direct test download
        if: github.ref == 'refs/heads/o-lovestv-lab'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="o-lovestv-lab-v0.1.0"
          FILE="O-LOVEStv-Lab-0.1.0-test.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "O! LOVEStv Lab 0.1.0" --notes "APK de laboratorio. No validada en televisor real."
          fi
