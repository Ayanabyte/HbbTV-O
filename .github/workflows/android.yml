name: Build HbbTV O!
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare direct APK download
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          APK="HbbTV-O-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK=${APK}" >> "$GITHUB_ENV"
      - name: Publish direct APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --title "HbbTV O! ${VERSION}" \
              --notes "APK de depuración de HbbTV O! ${VERSION}."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HbbTV-O-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
