name: O! LOVEStv Lab APK
on:
  push:
    branches: [main, o-lovestv-lab]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Restore verified ARM32 native bridges
        run: python3 tools/restore_native.py
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk O-LOVEStv-Lab-0.2.1-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: O-LOVEStv-Lab-APK
          path: O-LOVEStv-Lab-0.2.1-test.apk
      - name: Publish direct test download
        if: github.ref == 'refs/heads/o-lovestv-lab'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="o-lovestv-lab-v0.2.1"
          FILE="O-LOVEStv-Lab-0.2.1-test.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "O! LOVEStv Lab 0.2.1" --notes "APK de laboratorio. No validada en televisor real."
          fi
