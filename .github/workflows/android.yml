name: Android TV diagnostic APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Prepare direct APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          APK="HbbTV-O-${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK=${APK}" >> "$GITHUB_ENV"
      - name: Publish APK release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" \
              --title "HbbTV O! ${VERSION}" \
              --notes "APK de diagnóstico de HbbTV O! ${VERSION}."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: hbbtv-o-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            HbbTV-O-*-debug.apk
          if-no-files-found: error
