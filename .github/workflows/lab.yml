name: APK de pruebas TDT
on:
  push:
    branches: [lab-tdt-5314]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: O-TDT-Lab-0.1.1
          path: O-TDT-Lab-0.1.1.apk
      - name: Guardar la APK en la rama de pruebas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add O-TDT-Lab-0.1.1.apk
          git commit -m "APK de pruebas verificada"
          git push origin HEAD:lab-tdt-5314
