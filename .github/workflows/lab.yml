name: APK de pruebas TDT
on:
  push:
    branches: [lab-tdt-5314]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: O-TDT-Lab-0.1.0
          path: O-TDT-Lab-0.1.0.apk
